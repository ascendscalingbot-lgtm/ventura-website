<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e0d">
  <meta name="color-scheme" content="dark">
  <title>Ventura Ask · Client intake</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
  <div class="phone">
    <div class="app" id="app">
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      <div class="stage" id="stage">
        <img class="poster" src="./assets/host-poster.jpg" width="720" height="1280" alt="">
        <video
          id="host"
          playsinline
          webkit-playsinline
          muted
          loop
          autoplay
          preload="auto"
          poster="./assets/host-poster.jpg"
        >
          <source src="./assets/host-loop.mp4" type="video/mp4">
        </video>
      </div>

      <div class="hud" id="hud">
        <div class="banner" id="banner">You’re in preview mode. Answers stay on this device.</div>
        <div class="topbar">
          <button class="icon-btn" id="closeBtn" type="button" aria-label="Close">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
          <h1 class="step-title" id="chromeTitle">ventura.ask</h1>
          <button class="icon-btn" id="infoBtn" type="button" aria-label="About this ask">
            <i class="ph ph-rows" aria-hidden="true"></i>
          </button>
        </div>
        <p class="media-title" id="mediaTitle">Introduction</p>
        <div class="controls" id="controls" hidden>
          <span class="time" id="time">00:00 / 00:08</span>
          <button class="chip" id="muteBtn" type="button" aria-label="Mute">
            <i class="ph ph-speaker-high" aria-hidden="true"></i>
          </button>
          <button class="chip" id="ccBtn" type="button" aria-pressed="false">CC</button>
          <button class="chip is-ghost" id="rateBtn" type="button" aria-label="Playback speed">1×</button>
          <button class="chip is-ghost" id="fsBtn" type="button" aria-label="Full screen">
            <i class="ph ph-corners-out" aria-hidden="true"></i>
          </button>
        </div>
        <div class="grow play-wrap" id="playWrap">
          <button class="play-orb" id="playBtn" type="button" aria-label="Play">
            <i class="ph-fill ph-play" aria-hidden="true" style="font-size:36px;margin-left:4px"></i>
          </button>
        </div>
        <div class="bottom" id="bottom"></div>
      </div>

      <div class="sheet" id="sheet" hidden></div>
      <div class="rec-hud" id="recorder" hidden></div>
      <footer class="powered">
        <span>Powered by</span>
        <img src="../assets/vmc-mint-monogram.png" width="18" height="18" alt="">
        <strong>Ventura</strong>
      </footer>
      <div class="live" id="live" aria-live="polite"></div>
    </div>
  </div>
  <script src="./app.js" type="module"></script>
</body>
</html>
