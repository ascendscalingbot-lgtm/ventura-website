<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b0a">
  <title>Ventura Stream Build Kit</title>
  <meta name="description" content="Copy the prompts from Ventura's 30-day AI-native business build series.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0a;
      --surface: #0d1210;
      --surface-2: #111815;
      --line: rgba(229, 255, 244, 0.12);
      --line-strong: rgba(90, 224, 165, 0.34);
      --ink: #f3f7f5;
      --muted: #a5b0aa;
      --quiet: #758079;
      --mint: #5ae0a5;
      --mint-dark: #0d6f4b;
      --danger: #ff8f8f;
      --sans: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Newsreader", Georgia, serif;
      --radius: 20px;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --z-nav: 20;
      --z-toast: 40;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 74% 4%, rgba(90, 224, 165, .13), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
      z-index: -1;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    ::selection { background: rgba(90, 224, 165, .3); }

    .shell { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .nav {
      position: sticky;
      top: 16px;
      z-index: var(--z-nav);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      margin-top: 16px;
      padding: 9px 10px 9px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 11, 10, .82);
      backdrop-filter: blur(18px);
      box-shadow: inset 0 1px rgba(255,255,255,.05), 0 16px 48px rgba(0,0,0,.28);
    }
    .wordmark { font: italic 600 26px/1 var(--serif); letter-spacing: -.03em; text-decoration: none; }
    .wordmark span { color: var(--mint); }
    .nav-link, .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 150ms var(--ease-out), background-color 180ms ease, border-color 180ms ease;
    }
    .nav-link { background: var(--mint); color: #052116; }
    .nav-link:active, .button:active, .copy-button:active { transform: scale(.97); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(460px, 1.18fr);
      gap: clamp(42px, 6vw, 84px);
      align-items: center;
      min-height: calc(100dvh - 92px);
      padding: 64px 0 72px;
    }
    .series { margin: 0 0 22px; color: var(--mint); font-size: 13px; font-weight: 600; }
    h1, h2, h3, p { text-wrap: pretty; }
    h1 {
      max-width: 12ch;
      margin: 0;
      font: italic 600 clamp(48px, 6.1vw, 82px)/.98 var(--serif);
      letter-spacing: -.035em;
    }
    .dek { max-width: 560px; margin: 26px 0 0; color: var(--muted); font-size: clamp(17px, 1.7vw, 20px); line-height: 1.55; }
    .hero-media { position: relative; }
    .hero-media::before {
      content: "";
      position: absolute;
      inset: 10% 8% -6%;
      border-radius: var(--radius);
      background: rgba(90, 224, 165, .25);
      filter: blur(72px);
      opacity: .45;
      z-index: -1;
    }
    .thumbnail-frame {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 34px 90px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.09);
      transform: rotate(1.2deg);
      transition: transform 500ms var(--ease-out);
    }
    .thumbnail-frame img { width: 100%; height: 100%; object-fit: cover; }
    .day-stamp {
      position: absolute;
      right: -14px;
      bottom: -18px;
      padding: 13px 17px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: #0b1711;
      color: var(--mint);
      box-shadow: 0 18px 44px rgba(0,0,0,.4);
      font-size: 13px;
      font-weight: 700;
    }

    .gate {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, .8fr);
      gap: 38px;
      align-items: end;
      padding: 72px 0 92px;
      border-top: 1px solid var(--line);
    }
    .gate-copy h2, .prompt-intro h2 { margin: 0; font: italic 600 clamp(40px, 4.5vw, 64px)/1 var(--serif); letter-spacing: -.03em; }
    .gate-copy p { max-width: 54ch; margin: 20px 0 0; color: var(--muted); line-height: 1.65; }
    .lead-form {
      display: grid;
      gap: 14px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: inset 0 1px rgba(255,255,255,.04);
    }
    .fields { display: grid; grid-template-columns: .75fr 1.25fr; gap: 10px; }
    label { display: grid; gap: 8px; color: #dce5e0; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #080d0b;
      color: var(--ink);
      padding: 0 14px;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    input::placeholder { color: #7f8a84; }
    input:focus { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(90,224,165,.16); }
    .button { min-height: 50px; background: var(--mint); color: #052116; }
    .button[disabled] { cursor: wait; opacity: .65; }
    .form-note { margin: 0; color: var(--quiet); font-size: 12px; line-height: 1.5; }
    .form-note a { text-underline-offset: 3px; }
    .form-status { min-height: 20px; margin: 0; color: var(--muted); font-size: 13px; }
    .form-status.error { color: var(--danger); }
    .honeypot { position: absolute; left: -9999px; }

    .prompts-section { padding: 30px 0 120px; }
    .prompts-section[hidden] { display: none; }
    .prompt-intro { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 44px; }
    .prompt-intro p { max-width: 52ch; margin: 18px 0 0; color: var(--muted); line-height: 1.6; }
    .button.secondary { flex: none; border: 1px solid var(--line-strong); background: transparent; color: var(--mint); }
    .prompt-list { display: grid; gap: 18px; }
    .prompt-card {
      display: grid;
      grid-template-columns: minmax(220px, .55fr) minmax(0, 1.45fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .prompt-meta { padding: 28px; background: var(--surface-2); }
    .prompt-label { margin: 0 0 12px; color: var(--mint); font-size: 13px; font-weight: 700; }
    .prompt-meta h3 { margin: 0; font-size: clamp(21px, 2vw, 28px); line-height: 1.12; letter-spacing: -.025em; }
    .prompt-note { margin: 16px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .prompt-body { min-width: 0; padding: 20px; }
    .prompt-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .copy-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #080d0b;
      color: #dbe4df;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: transform 150ms var(--ease-out), border-color 180ms ease, color 180ms ease;
    }
    .copy-button:hover { border-color: var(--line-strong); color: var(--mint); }
    pre {
      max-height: 440px;
      margin: 0;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 14px;
      background: #070a09;
      padding: 22px;
      color: #d8e1dc;
      font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .closing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      margin-top: 72px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .closing p { max-width: 62ch; margin: 0; color: var(--muted); line-height: 1.6; }
    .closing a { color: var(--mint); font-weight: 700; text-underline-offset: 4px; }
    footer { padding: 30px 0 46px; color: var(--quiet); font-size: 13px; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: var(--z-toast);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #0b1711;
      color: var(--ink);
      padding: 12px 16px;
      box-shadow: 0 18px 54px rgba(0,0,0,.42);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 220ms var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .error-page { min-height: 70dvh; display: grid; place-items: center; text-align: center; }

    @media (hover: hover) and (pointer: fine) {
      .thumbnail-frame:hover { transform: rotate(0deg) translateY(-4px); }
      .nav-link:hover, .button:hover { transform: translateY(-1px); }
    }
    @media (max-width: 860px) {
      .hero, .gate { grid-template-columns: 1fr; }
      .hero { min-height: auto; padding-top: 64px; }
      h1 { max-width: 13ch; }
      .hero-media { width: 100%; max-width: 720px; }
      .gate { align-items: stretch; }
      .prompt-card { grid-template-columns: 1fr; }
      .prompt-intro, .closing { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1180px); }
      .nav { top: 8px; margin-top: 8px; min-height: 54px; padding-left: 15px; }
      .wordmark { font-size: 22px; }
      .nav-link { min-height: 38px; padding-inline: 14px; font-size: 13px; }
      .hero { gap: 42px; padding: 54px 0 64px; }
      h1 { font-size: clamp(44px, 13vw, 60px); }
      .dek { font-size: 17px; }
      .day-stamp { right: 10px; bottom: -16px; }
      .gate { padding: 62px 0 72px; }
      .fields { grid-template-columns: 1fr; }
      .lead-form, .prompt-meta, .prompt-body { padding: 18px; }
      .prompt-intro { margin-bottom: 28px; }
      .button.secondary { width: 100%; }
      pre { max-height: 520px; padding: 16px; font-size: 12px; }
      .closing { margin-top: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .thumbnail-frame { transform: none; }
    }
  </style>
</head>
<body>
  <nav class="nav shell" aria-label="Main navigation">
    <a class="wordmark" href="/">Ventura <span>Marketing</span></a>
    <a class="nav-link" href="#build-kit">Get the prompts</a>
  </nav>

  <main id="app">
    <div class="error-page shell" id="loading"><p>Loading the build kit...</p></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="page-template">
    <section class="hero shell">
      <div>
        <p class="series" data-series></p>
        <h1 data-title></h1>
        <p class="dek" data-description></p>
      </div>
      <div class="hero-media">
        <div class="thumbnail-frame"><img data-thumbnail width="1672" height="941"></div>
        <div class="day-stamp" data-day></div>
      </div>
    </section>

    <section class="gate shell" id="build-kit">
      <div class="gate-copy">
        <h2>Build it with us.</h2>
        <p>Enter your email once to unlock the complete prompt stack from this stream. Copy each prompt into Claude Code, Codex, or your preferred coding agent.</p>
      </div>
      <form class="lead-form" id="lead-form">
        <input type="hidden" name="_subject" data-subject>
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="company" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="fields">
          <label>First name<input name="first_name" autocomplete="given-name" placeholder="Shayan" required></label>
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label>
        </div>
        <button class="button" type="submit">Unlock the prompts</button>
        <p class="form-note">By unlocking, you agree to receive this build kit and occasional Ventura updates. Unsubscribe anytime. Read our <a href="/privacy-policy.html">privacy policy</a>.</p>
        <p class="form-status" id="form-status" aria-live="polite"></p>
      </form>
    </section>

    <section class="prompts-section shell" id="prompts" hidden>
      <div class="prompt-intro">
        <div>
          <h2>Your build stack.</h2>
          <p>Run these in order. Each prompt has one job, a clear finish line, and no filler.</p>
        </div>
        <button class="button secondary" id="copy-all" type="button">Copy all prompts</button>
      </div>
      <div class="prompt-list" id="prompt-list"></div>
      <div class="closing">
        <p>Want Ventura to build the AI-native operating system for your business instead?</p>
        <a href="https://ventura-website-ruddy.vercel.app/#book-consultation">Book a strategy session</a>
      </div>
    </section>
  </template>

  <template id="prompt-template">
    <article class="prompt-card">
      <div class="prompt-meta">
        <p class="prompt-label" data-label></p>
        <h3 data-prompt-title></h3>
        <p class="prompt-note" data-note></p>
      </div>
      <div class="prompt-body">
        <div class="prompt-toolbar"><button class="copy-button" type="button">Copy prompt</button></div>
        <pre></pre>
      </div>
    </article>
  </template>

  <footer class="shell"><span>© 2026 Ventura Marketing. Built for operators who ship.</span></footer>

  <script>
    const app = document.querySelector('#app');
    const toast = document.querySelector('#toast');
    const slug = new URLSearchParams(location.search).get('slug') || location.pathname.split('/').filter(Boolean).at(-1);
    let stream;

    function setText(root, selector, value) {
      const node = root.querySelector(selector);
      if (node) node.textContent = value || '';
    }

    function announce(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(announce.timer);
      announce.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      const original = button?.textContent;
      if (button) {
        button.textContent = 'Copied';
        setTimeout(() => button.textContent = original, 1400);
      }
      announce('Copied to clipboard');
    }

    function unlockPrompts(shouldScroll = true) {
      const section = document.querySelector('#prompts');
      section.hidden = false;
      localStorage.setItem('ventura-stream-prompts-unlocked', 'true');
      if (shouldScroll) section.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }

    function render(data) {
      stream = data;
      const fragment = document.querySelector('#page-template').content.cloneNode(true);
      setText(fragment, '[data-series]', data.series);
      setText(fragment, '[data-title]', data.title);
      setText(fragment, '[data-description]', data.description);
      setText(fragment, '[data-day]', `Day ${data.day} of 30`);
      fragment.querySelector('[data-subject]').value = `Ventura Stream Build Kit: ${data.title}`;
      const image = fragment.querySelector('[data-thumbnail]');
      image.src = data.thumbnail;
      image.alt = data.thumbnailAlt;

      app.replaceChildren(fragment);
      document.title = `${data.title} | Ventura`;
      document.querySelector('meta[name="description"]').content = data.description;

      const list = document.querySelector('#prompt-list');
      data.prompts.forEach((item) => {
        const prompt = document.querySelector('#prompt-template').content.cloneNode(true);
        setText(prompt, '[data-label]', item.label);
        setText(prompt, '[data-prompt-title]', item.title);
        setText(prompt, '[data-note]', item.note);
        prompt.querySelector('pre').textContent = item.prompt;
        prompt.querySelector('.copy-button').addEventListener('click', (event) => copyText(item.prompt, event.currentTarget));
        list.appendChild(prompt);
      });

      document.querySelector('#copy-all').addEventListener('click', (event) => {
        const all = data.prompts.map((item, index) => `${index + 1}. ${item.title}\n\n${item.prompt}`).join('\n\n==============================\n\n');
        copyText(all, event.currentTarget);
      });

      const form = document.querySelector('#lead-form');
      const status = document.querySelector('#form-status');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Unlocking...';
        status.className = 'form-status';
        status.textContent = 'Sending your build kit...';

        try {
          const response = await fetch(data.leadEndpoint, {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: new FormData(form)
          });
          const result = await response.json().catch(() => ({}));
          const accepted = result.success === true || result.success === 'true';
          if (!response.ok || !accepted) throw new Error(result.message || 'Submission failed');
          status.textContent = 'You are in. The prompts are unlocked below.';
          button.textContent = 'Prompts unlocked';
          unlockPrompts(true);
        } catch (error) {
          status.className = 'form-status error';
          status.textContent = 'We could not submit the form. Check your connection and try again.';
          button.disabled = false;
          button.textContent = 'Unlock the prompts';
        }
      });

      if (localStorage.getItem('ventura-stream-prompts-unlocked') === 'true') unlockPrompts(false);
    }

    fetch('/streams.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Could not load stream data');
        return response.json();
      })
      .then((streams) => {
        const data = streams[slug] || streams['clients-30k-dashboard-build'];
        if (!data) throw new Error('Stream not found');
        render(data);
      })
      .catch(() => {
        app.innerHTML = '<div class="error-page shell"><div><h1>Build kit unavailable.</h1><p class="dek">This stream page could not be loaded. Please try again shortly.</p></div></div>';
      });
  </script>
</body>
</html>
