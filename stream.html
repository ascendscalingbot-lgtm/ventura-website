<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b0a">
  <title>Ventura Stream Build Kit</title>
  <meta name="description" content="Copy the prompts from Ventura's 30-day AI-native business build series.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0a;
      --surface: #0d1210;
      --surface-2: #111815;
      --line: rgba(232, 255, 246, 0.12);
      --line-strong: rgba(184, 240, 216, 0.38);
      --ink: #f3f7f5;
      --muted: #a5b0aa;
      --quiet: #758079;
      --mint: #b8f0d8;
      --mint-dark: #2f8f69;
      --danger: #ff8f8f;
      --sans: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Newsreader", Georgia, serif;
      --radius: 20px;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --z-nav: 20;
      --z-toast: 40;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 50% 2%, rgba(184, 240, 216, .13), transparent 32rem),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
      z-index: -1;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    ::selection { background: rgba(184, 240, 216, .3); }

    .shell { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .nav {
      position: relative;
      z-index: var(--z-nav);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 82px;
      margin-top: 10px;
      padding: 8px;
    }
    .brand-logo { display: block; width: 74px; height: 56px; object-fit: contain; }
    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 150ms var(--ease-out), background-color 180ms ease, border-color 180ms ease;
    }
    .button:active, .copy-button:active { transform: scale(.97); }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 8px 0 64px;
      text-align: center;
    }
    .hero-media { position: relative; width: min(100%, 980px); }
    .hero-media::before {
      content: "";
      position: absolute;
      inset: 10% 8% -6%;
      border-radius: var(--radius);
      background: rgba(184, 240, 216, .22);
      filter: blur(72px);
      opacity: .42;
      z-index: -1;
    }
    .thumbnail-frame {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 34px 90px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.09);
      transition: transform 500ms var(--ease-out);
    }
    .thumbnail-frame img { width: 100%; height: 100%; object-fit: cover; }
    .day-stamp {
      position: absolute;
      right: 18px;
      bottom: -18px;
      padding: 12px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: #0b1711;
      color: var(--mint);
      box-shadow: 0 18px 44px rgba(0,0,0,.4);
      font-size: 13px;
      font-weight: 700;
    }
    .hero-copy { display: flex; flex-direction: column; align-items: center; margin-top: 56px; }
    .series { margin: 0 0 18px; color: var(--mint); font-size: 13px; font-weight: 700; }
    h1, h2, h3, p { text-wrap: pretty; }
    h1 {
      max-width: 15ch;
      margin: 0;
      font: italic 600 clamp(48px, 6.1vw, 78px)/1 var(--serif);
      letter-spacing: -.035em;
    }
    .dek { max-width: 650px; margin: 24px 0 0; color: var(--muted); font-size: clamp(17px, 1.7vw, 20px); line-height: 1.55; }

    .gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 0 86px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .gate-copy { display: flex; flex-direction: column; align-items: center; }
    .gate-copy h2, .prompt-intro h2 { margin: 0; font: italic 600 clamp(40px, 4.5vw, 64px)/1 var(--serif); letter-spacing: -.03em; }
    .gate-copy p { max-width: 58ch; margin: 20px 0 0; color: var(--muted); line-height: 1.65; }
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(100%, 620px);
      margin-top: 28px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: inset 0 1px rgba(255,255,255,.04);
    }
    .button { min-height: 50px; background: var(--mint); color: #062219; padding-inline: 26px; }
    .preview-note { margin: 0; color: var(--quiet); font-size: 13px; line-height: 1.5; }

    .prompts-section { width: min(960px, calc(100% - 40px)); padding: 30px 0 120px; }
    .prompts-section[hidden] { display: none; }
    .prompt-intro { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-bottom: 44px; text-align: center; }
    .prompt-intro p { max-width: 52ch; margin: 18px auto 0; color: var(--muted); line-height: 1.6; }
    .button.secondary { flex: none; border: 1px solid var(--line-strong); background: transparent; color: var(--mint); }
    .prompt-list { display: grid; gap: 18px; }
    .prompt-card {
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .prompt-meta { padding: 30px; background: var(--surface-2); text-align: center; }
    .prompt-label { margin: 0 0 12px; color: var(--mint); font-size: 13px; font-weight: 700; }
    .prompt-meta h3 { margin: 0; font-size: clamp(21px, 2vw, 28px); line-height: 1.12; letter-spacing: -.025em; }
    .prompt-note { max-width: 62ch; margin: 16px auto 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .prompt-body { min-width: 0; padding: 20px; }
    .prompt-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .copy-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #080d0b;
      color: #dbe4df;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: transform 150ms var(--ease-out), border-color 180ms ease, color 180ms ease;
    }
    .copy-button:hover { border-color: var(--line-strong); color: var(--mint); }
    pre {
      max-height: 440px;
      margin: 0;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 14px;
      background: #070a09;
      padding: 22px;
      color: #d8e1dc;
      font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .closing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      margin-top: 72px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .closing p { max-width: 62ch; margin: 0; color: var(--muted); line-height: 1.6; }
    .closing a { color: var(--mint); font-weight: 700; text-underline-offset: 4px; }
    footer { padding: 30px 0 46px; color: var(--quiet); font-size: 13px; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: var(--z-toast);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #0b1711;
      color: var(--ink);
      padding: 12px 16px;
      box-shadow: 0 18px 54px rgba(0,0,0,.42);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 220ms var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .error-page { min-height: 70dvh; display: grid; place-items: center; text-align: center; }

    @media (hover: hover) and (pointer: fine) {
      .thumbnail-frame:hover { transform: translateY(-4px); }
      .button:hover { transform: translateY(-1px); }
    }
    @media (max-width: 860px) {
      .hero { padding-top: 8px; }
      h1 { max-width: 13ch; }
      .hero-media { width: 100%; max-width: 720px; }
      .closing { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1180px); }
      .nav { margin-top: 4px; min-height: 70px; }
      .brand-logo { width: 64px; height: 48px; }
      .hero { padding: 4px 0 56px; }
      h1 { font-size: clamp(44px, 13vw, 60px); }
      .dek { font-size: 17px; }
      .day-stamp { right: 10px; bottom: -16px; }
      .hero-copy { margin-top: 48px; }
      .gate { padding: 62px 0 72px; }
      .preview-panel, .prompt-meta, .prompt-body { padding: 18px; }
      .prompt-intro { margin-bottom: 28px; }
      .button.secondary { width: 100%; }
      pre { max-height: 520px; padding: 16px; font-size: 12px; }
      .closing { margin-top: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .thumbnail-frame { transform: none; }
    }
  </style>
</head>
<body>
  <header class="nav shell">
    <a href="/" aria-label="Ventura Marketing home">
      <img class="brand-logo" src="/assets/vmc-mint-monogram.png" alt="VMC">
    </a>
  </header>

  <main id="app">
    <div class="error-page shell" id="loading"><p>Loading the build kit...</p></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="page-template">
    <section class="hero shell">
      <div class="hero-media">
        <div class="thumbnail-frame"><img data-thumbnail width="1672" height="941"></div>
        <div class="day-stamp" data-day></div>
      </div>
      <div class="hero-copy">
        <p class="series" data-series></p>
        <h1 data-title></h1>
        <p class="dek" data-description></p>
      </div>
    </section>

    <section class="gate shell" id="build-kit">
      <div class="gate-copy">
        <h2>Build it with us.</h2>
        <p>Preview the complete prompt stack from this stream, then copy each step into Claude Code, Codex, or your preferred coding agent.</p>
      </div>
      <div class="preview-panel">
        <button class="button" id="preview-prompts" type="button" aria-controls="prompts" aria-expanded="false">Preview all prompts</button>
        <p class="preview-note">Preview mode is on. Lead capture will be connected later.</p>
      </div>
    </section>

    <section class="prompts-section shell" id="prompts" hidden>
      <div class="prompt-intro">
        <div>
          <h2>Your build stack.</h2>
          <p>Run these in order. Each prompt has one job, a clear finish line, and no filler.</p>
        </div>
        <button class="button secondary" id="copy-all" type="button">Copy all prompts</button>
      </div>
      <div class="prompt-list" id="prompt-list"></div>
      <div class="closing">
        <p>Want Ventura to build the AI-native operating system for your business instead?</p>
        <a href="https://ventura-website-ruddy.vercel.app/#book-consultation">Book a strategy session</a>
      </div>
    </section>
  </template>

  <template id="prompt-template">
    <article class="prompt-card">
      <div class="prompt-meta">
        <p class="prompt-label" data-label></p>
        <h3 data-prompt-title></h3>
        <p class="prompt-note" data-note></p>
      </div>
      <div class="prompt-body">
        <div class="prompt-toolbar"><button class="copy-button" type="button">Copy prompt</button></div>
        <pre></pre>
      </div>
    </article>
  </template>

  <footer class="shell"><span>© 2026 Ventura Marketing. Built for operators who ship.</span></footer>

  <script>
    const app = document.querySelector('#app');
    const toast = document.querySelector('#toast');
    const slug = new URLSearchParams(location.search).get('slug') || location.pathname.split('/').filter(Boolean).at(-1);
    let stream;

    function setText(root, selector, value) {
      const node = root.querySelector(selector);
      if (node) node.textContent = value || '';
    }

    function announce(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(announce.timer);
      announce.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      const original = button?.textContent;
      if (button) {
        button.textContent = 'Copied';
        setTimeout(() => button.textContent = original, 1400);
      }
      announce('Copied to clipboard');
    }

    function unlockPrompts(shouldScroll = true) {
      const section = document.querySelector('#prompts');
      section.hidden = false;
      const button = document.querySelector('#preview-prompts');
      button.textContent = 'Prompts are open';
      button.setAttribute('aria-expanded', 'true');
      if (shouldScroll) section.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }

    function render(data) {
      stream = data;
      const fragment = document.querySelector('#page-template').content.cloneNode(true);
      setText(fragment, '[data-series]', data.series);
      setText(fragment, '[data-title]', data.title);
      setText(fragment, '[data-description]', data.description);
      setText(fragment, '[data-day]', `Day ${data.day} of 30`);
      const image = fragment.querySelector('[data-thumbnail]');
      image.src = data.thumbnail;
      image.alt = data.thumbnailAlt;

      app.replaceChildren(fragment);
      document.title = `${data.title} | Ventura`;
      document.querySelector('meta[name="description"]').content = data.description;

      const list = document.querySelector('#prompt-list');
      data.prompts.forEach((item) => {
        const prompt = document.querySelector('#prompt-template').content.cloneNode(true);
        setText(prompt, '[data-label]', item.label);
        setText(prompt, '[data-prompt-title]', item.title);
        setText(prompt, '[data-note]', item.note);
        prompt.querySelector('pre').textContent = item.prompt;
        prompt.querySelector('.copy-button').addEventListener('click', (event) => copyText(item.prompt, event.currentTarget));
        list.appendChild(prompt);
      });

      document.querySelector('#copy-all').addEventListener('click', (event) => {
        const all = data.prompts.map((item, index) => `${index + 1}. ${item.title}\n\n${item.prompt}`).join('\n\n==============================\n\n');
        copyText(all, event.currentTarget);
      });

      document.querySelector('#preview-prompts').addEventListener('click', () => unlockPrompts(true));
    }

    fetch('/streams.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Could not load stream data');
        return response.json();
      })
      .then((streams) => {
        const data = streams[slug] || streams['clients-30k-dashboard-build'];
        if (!data) throw new Error('Stream not found');
        render(data);
      })
      .catch(() => {
        app.innerHTML = '<div class="error-page shell"><div><h1>Build kit unavailable.</h1><p class="dek">This stream page could not be loaded. Please try again shortly.</p></div></div>';
      });
  </script>
</body>
</html>
